[workspace]
members = ["."]

[workspace.dependencies]
arma-rs = "1.13.0"
mockito = "1.7.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
jev = "0.1.2"

[package]
authors = ["DarkWanderer <elquentaro@gmail.com>"]
edition = "2024"
name = "system1"
version = "0.1.0"

[lib]
crate-type = ["cdylib", "rlib"]
name = "system1"

[dependencies]
arma-rs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
jev = "0.1.2"

[dev-dependencies]
mockito = { workspace = true }

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
